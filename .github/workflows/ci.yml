name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt into more if they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Validates the published shape: exports map, types resolution under every module system,
      # and that a real consumer can install the tarball and use it from ESM and CJS.
      - run: npx publint
      - run: npx attw --pack .
      - run: npm run test:smoke
      # The SDK ships zero runtime dependencies; anything reported here would reach consumers.
      - run: npm audit --omit=dev --audit-level=high

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails when a PR changes what ships to npm but declares no version bump, so nothing
      # consumers can see is released without a changelog entry.
      #
      # The check has to be scoped by hand: this is a single-package repo, so `changeset status`
      # treats *any* change as package-relevant and would demand a changeset for a README typo.
      - name: Require a changeset when the published package changes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # The "Version Packages" PR is the release itself: it *consumes* the pending changesets
          # and bumps package.json. Demanding a changeset from it would deadlock every release.
          if [ "$HEAD_REF" = "changeset-release/$BASE_REF" ]; then
            echo "Release PR from changesets: it consumes changesets rather than adding one."
            exit 0
          fi

          # The SDK has zero runtime dependencies, so Dependabot only ever touches devDependencies
          # and workflow pins — never anything a consumer installs.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: no consumer-visible change, no changeset required."
            exit 0
          fi

          changed="$(git diff --name-only "origin/$BASE_REF...HEAD" -- src package.json)"
          if [ -z "$changed" ]; then
            echo "No published code changed (only docs, CI, tests, or examples)."
            echo "A changeset is not required."
            exit 0
          fi

          echo "These files ship to consumers, so this PR needs a changeset:"
          echo "$changed"
          npx changeset status --since="origin/$BASE_REF"
