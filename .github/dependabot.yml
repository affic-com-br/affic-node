version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['dependencies']
    # Everything lands in one PR, majors included. Three reasons:
    #   - Tooling moves in pairs (eslint/@eslint/js, vitest/@vitest/coverage-v8). Split across
    #     PRs, neither can merge: each half fails CI without the other.
    #   - One PR means one package-lock.json rewrite. Separate PRs all touch the lockfile, so
    #     the first to merge leaves the rest conflicted.
    #   - The SDK ships zero runtime dependencies, so none of this reaches consumers.
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['dependencies', 'github-actions']
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    commit-message:
      prefix: 'chore(actions)'
