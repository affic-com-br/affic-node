version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['dependencies']
    # Dev dependencies only — the SDK ships none at runtime — so batching keeps the noise down.
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['dependencies', 'github-actions']
    commit-message:
      prefix: 'chore(actions)'
