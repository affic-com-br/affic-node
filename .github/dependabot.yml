version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['dependencies']
    # Everything lands in one PR, majors included. Three reasons:
    #   - Tooling moves in pairs (eslint/@eslint/js, vitest/@vitest/coverage-v8). Split across
    #     PRs, neither can merge: each half fails CI without the other.
    #   - One PR means one package-lock.json rewrite. Separate PRs all touch the lockfile, so
    #     the first to merge leaves the rest conflicted.
    #   - The SDK ships zero runtime dependencies, so none of this reaches consumers.
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    ignore:
      # TypeScript 7 cannot be installed yet: every published typescript-eslint, including the
      # canary, declares `peer typescript: ">=4.8.4 <6.1.0"`, so npm ci fails to resolve and the
      # whole CI run dies at install. We track 6.0.x, the newest version the lint stack accepts.
      # Remove this once typescript-eslint ships a release whose peer range includes 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['dependencies', 'github-actions']
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    commit-message:
      prefix: 'chore(actions)'
